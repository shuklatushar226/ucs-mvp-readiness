name: Refresh the PR tracker

# The capability matrix (src/data/mvp.json) is NO LONGER built here. It is owned
# by the grace database on the batch box, which refreshes it from prism every
# 12h, exports it and pushes — so this workflow regenerating it too would give
# the same file two writers, from different checkouts at different times,
# flip-flopping it daily. What is left is the PR tracker, which reads live
# GitHub state and has no other writer (the boss only publishes it when
# dashboard_repo is configured, and it is not).
#
# Why commit the data instead of pinging a Netlify build hook: the push IS the
# repository activity that keeps this schedule alive. GitHub disables scheduled
# workflows in public repos after 60 days of inactivity, which would be fatal
# for a repo that otherwise never changes. The box's own 12h pushes now also
# count towards that, so the schedule is doubly safe.
# workflow_dispatch is the escape hatch if the schedule is ever disabled anyway.

on:
  schedule:
    # 03:17 UTC — deliberately off the hour; GitHub drops scheduled jobs at :00
    # when the queue is busy.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate tracker.json
        # PR metadata for the Mon-Fri tracker. hyperswitch-prism is public, so
        # this repo's GITHUB_TOKEN can read its pull requests. A failed query is
        # recorded in the file's `warnings` and rendered as a banner — an empty
        # column must never be mistaken for a quiet week. Never fails the run:
        # the matrix refresh does not depend on PR data.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generators/tracker/build_tracker.py --repo juspay/hyperswitch-prism

      - name: Commit if the tracker moved
        id: commit
        run: |
          # mvp.json is NOT touched here any more. It is owned by the grace
          # database on the batch box, which refreshes it from prism every 12h
          # and pushes it. Regenerating it here as well would mean two writers
          # producing the same file from different checkouts at different
          # times, flip-flopping it daily.
          if git diff --quiet -- src/data/tracker.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "mvp-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/tracker.json
          git commit -m "chore(data): refresh PR tracker"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The site is deployed from here rather than from a Netlify git link, so
      # there is no one-time UI authorization and no build minutes are spent on
      # Netlify's side. Only runs when the data actually moved.
      - name: Set up Node
        if: steps.commit.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Deploy to Netlify
        if: steps.commit.outputs.changed == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes netlify-cli@latest deploy --prod --dir=dist \
            --site="${{ secrets.NETLIFY_SITE_ID }}" \
            --message="PR tracker $(date -u +%Y-%m-%dT%H:%MZ)"
