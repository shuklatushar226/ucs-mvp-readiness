# Build settings live here rather than in the Netlify UI, so linking the repo is
# the only manual step: Netlify reads this on connect.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: /mvp and /mvp/metrics are client-side routes, so a hard refresh
# or a shared deep link must still be served index.html. Netlify has no UI for
# redirects — they have to come from a file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
